name: Build Open Health IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: bash ci_scripts/ci_post_clone.sh

      - name: Build iPhone app
        working-directory: apps/ios/OuraApp
        run: |
          xcodebuild \
            -project OuraApp.xcodeproj \
            -scheme OuraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/open-health-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/open-health-build/Build/Products/Release-iphoneos/OuraApp.app" Payload/
          ditto -c -k --keepParent Payload OpenHealth.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenHealth-iOS
          path: OpenHealth.ipa
          retention-days: 14
